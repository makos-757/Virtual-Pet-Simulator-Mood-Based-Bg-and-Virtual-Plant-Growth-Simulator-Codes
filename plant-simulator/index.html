<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Growth Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🌱 Plant Growth Simulator</h1>
        <div id="plant" class="plant">🌱</div>
        <h2 id="stage">Seedling</h2>
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
        <p id="percentage">0% Growth</p>
        <div class="buttons">
            <button id="water-btn" onclick="waterPlant()">💧 Water</button>
            <button id="sun-btn" onclick="giveSunlight()">☀️ Sunlight</button>
            <button id="reset-btn" onclick="resetPlant()">🔄 Reset</button>
        </div>
        <p id="message">Take care of your plant!</p>
    </div>
    <footer class="watermark">
        <p>Made by <a href="https://makostech.me" target="_blank" rel="noopener">Makos Tech</a></p>
        <p>Contact: <a href="https://wa.me/254727240573" target="_blank" rel="noopener">+254 727 240 573</a></p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
