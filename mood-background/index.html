<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Changer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 id="emoji">😊</h1>
        <h2 id="title">How are you feeling today?</h2>
        <p id="message">Choose your mood below!</p>
        <div class="buttons">
            <button onclick="changeMood('happy')">😊 Happy</button>
            <button onclick="changeMood('sad')">😢 Sad</button>
            <button onclick="changeMood('tired')">😴 Tired</button>
            <button onclick="changeMood('angry')">😡 Angry</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
