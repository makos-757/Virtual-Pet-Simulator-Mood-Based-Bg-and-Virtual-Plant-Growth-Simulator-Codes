<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Changer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="emoji" id="emoji">😊</div>
        <h1 id="title">How are you feeling today?</h1>
        <p id="message">Choose your mood below!</p>
        <div class="buttons">
            <button data-mood="happy" class="mood-btn active">😊 Happy</button>
            <button data-mood="sad" class="mood-btn">😢 Sad</button>
            <button data-mood="tired" class="mood-btn">😴 Tired</button>
            <button data-mood="angry" class="mood-btn">😡 Angry</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
