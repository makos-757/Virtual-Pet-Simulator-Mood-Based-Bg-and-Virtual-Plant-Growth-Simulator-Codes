<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Pet Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🐶 My Virtual Pet</h1>
        <div id="pet" class="pet">🐶</div>
        <h2 id="pet-name">Buddy</h2>
        <div class="stats">
            <div class="stat">
                <div class="stat-header">
                    <span>😊 Happiness</span>
                    <span id="happiness">50%</span>
                </div>
                <div class="bar">
                    <div id="happiness-bar"></div>
                </div>
            </div>
            <div class="stat">
                <div class="stat-header">
                    <span>⚡ Energy</span>
                    <span id="energy">50%</span>
                </div>
                <div class="bar">
                    <div id="energy-bar"></div>
                </div>
            </div>
        </div>
        <div class="buttons">
            <button id="feed-btn" onclick="feedPet()">🍔 Feed</button>
            <button id="play-btn" onclick="playWithPet()">🎮 Play</button>
            <button id="sleep-btn" onclick="sleepPet()">😴 Sleep</button>
            <button id="reset-btn" onclick="resetPet()">🔄 Reset</button>
        </div>
        <p id="message">Buddy is waiting for you!</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
